<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta</title>
    <link rel="stylesheet" href="static/criar_conta.css">
</head>

<body>

    <div class="container">

        <img src="static/Adobe Express - file.png"
             alt="Logo"
             class="logo">

        <h1>Criar Conta</h1>

        <form action="/salvar_conta" method="POST">

           <input
             type="email"
             name="email"
             placeholder="Email"
             required>

            <input
                type="password"
                name="senha"
                placeholder="Senha"
                required>

            <input type="hidden" name="tipo" value="usuario">

            <button type="submit">
                Criar Conta
            </button>

        </form>

        <a href="/">
            <button class="voltar">
                Voltar
            </button>
        </a>

    </div>

</body>
</html>
