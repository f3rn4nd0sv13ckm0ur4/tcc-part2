<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar e Criar Contas</title>
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#0056b3">
    <link rel="stylesheet" href="static/criar_conta.css">
    <link rel="stylesheet" href="static/mobile.css" media="only screen and (max-width: 768px)">
</head>

<body>

    <div class="container">

        <img src="static/Adobe Express - file.png"
             alt="Logo"
             class="logo">

        <h1>Gerenciar Contas</h1>

        <!-- FORMULÁRIO DE CADASTRO -->
        <form action="/salvar_conta" method="POST">

            <input
                type="email"
                name="email"
                placeholder="Email do usuário"
                required>

            <input
                type="password"
                name="senha"
                placeholder="Senha"
                required>

            <select name="tipo" required>
                <option value="usuario">👤 Usuário Comum</option>
                <option value="admin">⭐ Administrador</option>
            </select>

            <button type="submit">
                ➕ Cadastrar Conta
            </button>

        </form>

        <!-- LISTA DE USUÁRIOS CADASTRADOS -->
        {% if usuarios %}
        <div class="secao-usuarios">
            <h3>👥 Contas Cadastradas</h3>
            <div class="tabela-usuarios-container">
                <table class="tabela-usuarios">
                    <thead>
                        <tr>
                            <th>Email</th>
                            <th>Tipo</th>
                            <th>Ação</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for u in usuarios %}
                        <tr>
                            <td class="email-col">{{ u.email }}</td>
                            <td>
                                <span class="badge {{ 'badge-admin' if u.tipo == 'admin' else 'badge-user' }}">
                                    {{ 'Admin' if u.tipo == 'admin' else 'Usuário' }}
                                </span>
                            </td>
                            <td>
                                {% if session.email != u.email %}
                                <a href="/excluir_usuario/{{ u.id }}"
                                   class="btn-excluir"
                                   onclick="return confirm('Tem certeza que deseja excluir a conta de {{ u.email }}?');"
                                   title="Excluir Usuário">
                                    🗑️ Excluir
                                </a>
                                {% else %}
                                <span class="texto-voce">(Você)</span>
                                {% endif %}
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
        {% endif %}

        <a href="/estoque.html">
            <button type="button" class="voltar">
                ⬅ Voltar ao Estoque
            </button>
        </a>

    </div>

</body>
</html>
