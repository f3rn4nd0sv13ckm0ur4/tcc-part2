<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Histórico de Retiradas</title>

    <link rel="stylesheet" href="static/retirados.css">
</head>

<body>

    <div class="topo">

        <h1>Histórico de Retiradas</h1>

        <img src="static/Sistema-Fiep-Azul.png" class="logo">

    </div>

    <div class="container">

        <table>

            <tr>
                <th>ITEM</th>
                <th>QUANTIDADE</th>
                <th>PESSOA</th>
                <th>HORÁRIO</th>
            </tr>

           {% for retirada in retiradas %}
<tr>
    <td>{{ retirada.nome }}</td>
    <td>{{ retirada.quantidade }}</td>
    <td>{{ retirada.responsavel }}</td>
    <td>{{ retirada.data_hora }}</td>
</tr>
{% endfor %}

        </table>

        <div class="botoes">

            <a href="estoque.html">

                <button>
                    VOLTAR
                </button>

            </a>

        </div>

    </div>

<script src="static/script.js"></script>

</body>
</html>
